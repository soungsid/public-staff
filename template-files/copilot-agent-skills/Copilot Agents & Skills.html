<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Copilot — Agents &amp; Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
        mono: ['IBM Plex Mono', 'Courier New', 'monospace'],
      }
    }
  },
  safelist: [
    'opacity-0','opacity-100','translate-y-0','translate-y-3',
    'pointer-events-none','pointer-events-auto','scale-[1.6]',
    'bg-white/20','active'
  ]
}
</script>
<style>
:root {
  --dark:       oklch(20% 0.09 12);
  --dark-mid:   oklch(28% 0.10 12);
  --accent:     oklch(52% 0.18 22);
  --accent-hi:  oklch(60% 0.20 25);
  --accent-dim: oklch(52% 0.07 22);
  --accent-bg:  oklch(96.5% 0.016 22);
  --blue:       oklch(50% 0.14 250);
  --blue-bg:    oklch(95% 0.025 250);
  --green:      oklch(48% 0.14 155);
  --amber:      oklch(62% 0.14 80);
  --bg:         oklch(97.5% 0.007 15);
  --text:       oklch(17% 0.025 15);
  --muted:      oklch(50% 0.035 15);
  --border:     oklch(89% 0.015 15);
  --code-bg:    oklch(16% 0.04 240);
  --code-fg:    oklch(88% 0.03 200);
}
/* Transitions */
.slide      { transition: opacity 0.4s ease; }
.step-item  { transition: opacity 0.38s ease, transform 0.38s ease; }
/* Code syntax */
.ck { color: oklch(72% 0.15 200); }
.cv { color: oklch(82% 0.12 120); }
.cs { color: oklch(78% 0.12 150); }
.cd { color: oklch(72% 0.15 200); }
.cc { color: rgba(255,255,255,.32); font-style: italic; }
.cm { color: rgba(255,255,255,.45); }
.ch { color: oklch(82% 0.1 55); font-weight: 600; }
/* Inline semantic elements in content */
em     { color: var(--accent); font-style: normal; font-weight: 500; }
strong { font-weight: 600; }
code   { font-family: 'IBM Plex Mono', monospace; font-size: .88em;
         background: rgba(0,0,0,.07); padding: 2px 7px; border-radius: 4px; }
</style>
</head>
<body class="w-full h-full overflow-hidden bg-[#0d0d0d] font-sans">

<div id="stage" class="w-screen h-screen flex items-center justify-center bg-[#0d0d0d]">
  <div id="canvas" class="relative w-[1920px] h-[1080px] overflow-hidden origin-center">
    <div id="slides-container"></div>
    <nav id="progress" class="absolute bottom-0 left-0 right-0 h-[52px] flex z-50"
         style="background:var(--dark);border-top:1px solid var(--dark-mid)"></nav>
  </div>
</div>

<div class="fixed bottom-2 right-3 text-[12px] text-white/20 pointer-events-none z-[999] tracking-wide">
  ← ↑ Précédent &nbsp;|&nbsp; → ↓ Space Enter Suivant
</div>

<script src="copilot-data.js"></script>
<script>
let currentSlide = 0, currentStep = 0;
const SK = 'copilot-pres-v3';

/* ── Helpers ──────────────────────────────────────────── */
function e(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(code) {
  let d = 0;
  return code.split('\n').map(line => {
    if (line.trim() === '---') { d++; return `<span class="cd">${e(line)}</span>`; }
    if (d < 2) {
      const kv = line.match(/^(\s*)([\w-]+)\s*:\s*(.*)$/);
      if (kv) return `${e(kv[1])}<span class="ck">${e(kv[2])}</span>: ${kv[3] ? `<span class="cv">${e(kv[3])}</span>` : ''}`;
      const li = line.match(/^(\s*)-\s+(.+)$/);
      if (li) return `${e(li[1])}<span class="cd">-</span> <span class="cs">${e(li[2])}</span>`;
      return e(line) || '';
    }
    if (!line.trim()) return '';
    if (line.trim().startsWith('## ')) return `<span class="ch">${e(line)}</span>`;
    return `<span class="cm">${e(line)}</span>`;
  }).join('\n');
}

function badge(b) {
  const lo = (b||'').toLowerCase();
  if (lo === 'requis')           return 'bg-[oklch(91%_0.07_22)] text-[var(--accent)]';
  if (lo.startsWith('recommand'))return 'bg-[oklch(93%_0.05_90)] text-[oklch(40%_0.14_90)]';
  return 'bg-[oklch(94%_0.02_15)] text-[var(--muted)]';
}

function impactCls(l) {
  return { high:'bg-[oklch(91%_0.07_22)] text-[var(--accent)]',
           medium:'bg-[oklch(93%_0.06_80)] text-[oklch(40%_0.14_80)]',
           low:'bg-[oklch(93%_0.07_140)] text-[oklch(40%_0.14_140)]',
           zero:'bg-[var(--blue-bg)] text-[var(--blue)]' }[l] || 'bg-gray-100 text-gray-500';
}

function eyebrow(data, idx) {
  const sec = PRESENTATION_DATA.sections.find(s => s.id === data.sectionId);
  return `<div class="h-[52px] min-h-[52px] flex items-center justify-between px-[80px]" style="background:var(--dark)">
    <span class="text-[17px] font-medium tracking-[0.08em] uppercase text-white/45">${sec?.label||''}</span>
    <span class="text-[19px] text-white/30">${idx+1} / ${PRESENTATION_DATA.slides.length}</span>
  </div>`;
}

function hdr(data) {
  return `<div class="relative px-[80px] pt-8 pb-7 bg-white border-b-2" style="border-color:var(--border)">
    <div class="absolute top-0 left-0 right-0 h-1" style="background:var(--accent)"></div>
    <h2 class="text-[56px] font-bold tracking-tight leading-[1.1]" style="color:var(--text)">${data.title}</h2>
    ${data.context ? `<p class="mt-1.5 text-[24px] font-mono" style="color:var(--muted)">${e(data.context)}</p>` : ''}
    ${data.badge   ? `<span class="absolute top-8 right-[80px] text-[19px] font-semibold px-3.5 py-1 border rounded" style="color:var(--accent);border-color:var(--accent-dim)">${data.badge}</span>` : ''}
  </div>`;
}

function body(cls, inner) {
  return `<div class="flex-1 overflow-hidden px-[80px] pt-7 pb-[60px] ${cls}" style="background:var(--bg)">${inner}</div>`;
}

function wrap(i, cls='') {
  return `<div class="step-item opacity-0 translate-y-3 pointer-events-none ${cls}" data-step="${i}">`;
}

/* ── Step renderers ───────────────────────────────────── */
function step(s) {
  switch(s.type) {

    case 'definition':
      return `<p class="text-[34px] leading-[1.55] max-w-[1520px]" style="color:var(--text)">${s.text}</p>`;

    case 'rule':
      return `<div class="border-l-4 px-7 py-[18px] rounded-r-xl text-[28px] leading-[1.45]"
                   style="border-color:var(--accent);background:var(--accent-bg);color:var(--text)">${s.text}</div>`;

    case 'chips':
      return `<div class="flex items-center flex-wrap gap-3.5">
        ${s.label?`<span class="text-[22px] font-medium mr-2" style="color:var(--muted)">${s.label} :</span>`:''}
        ${s.items.map(i=>`<span class="px-6 py-2.5 rounded-full text-[25px] font-medium text-white" style="background:var(--dark)">${i}</span>`).join('')}
      </div>`;

    case 'field':
      return `<div class="flex items-start gap-5 px-[22px] py-4 bg-white rounded-xl border" style="border-color:var(--border)">
        <span class="font-mono text-[26px] font-medium min-w-[220px] pt-0.5" style="color:var(--dark)">${s.name}</span>
        <span class="text-[13px] font-bold tracking-[0.07em] uppercase px-2.5 py-1 rounded self-start mt-1 min-w-[108px] text-center ${badge(s.badge)}">${s.badge}</span>
        <div class="flex-1">
          <div class="text-[28px] font-medium leading-[1.3]" style="color:var(--text)">${s.desc}</div>
          ${s.sub?`<div class="text-[22px] mt-1 leading-[1.3]" style="color:var(--muted)">${s.sub}</div>`:''}
        </div>
      </div>`;

    case 'file':
      return `<div class="flex items-start gap-5 px-[22px] py-4 bg-white rounded-xl border" style="border-color:var(--border)">
        <span class="font-mono text-[26px] font-medium min-w-[240px] pt-0.5" style="color:var(--blue)">${s.name}</span>
        <span class="text-[13px] font-bold tracking-[0.07em] uppercase px-2.5 py-1 rounded self-start mt-1 min-w-[108px] text-center ${badge(s.badge)}">${s.badge||'Optionnel'}</span>
        <div class="flex-1 text-[28px] font-medium leading-[1.3]" style="color:var(--text)">${s.desc}</div>
      </div>`;

    case 'field-group':
      return `<div>
        <div class="text-[19px] font-bold tracking-[0.08em] uppercase mb-3" style="color:var(--muted)">${s.label}</div>
        <div class="flex flex-col gap-2.5">
          ${s.fields.map(f=>`<div class="flex gap-6 items-baseline px-[18px] py-2.5 bg-white rounded-lg border" style="border-color:var(--border)">
            <span class="font-mono text-[24px] font-medium min-w-[160px]" style="color:var(--dark)">${f.name}</span>
            <span class="text-[24px] leading-[1.3]" style="color:var(--muted)">${f.desc}</span>
          </div>`).join('')}
        </div>
      </div>`;

    case 'location':
      return `<div class="flex items-start gap-7 px-7 py-5 bg-white rounded-xl border" style="border-color:var(--border)">
        <span class="text-[18px] font-bold tracking-[0.08em] uppercase min-w-[190px] mt-1" style="color:var(--accent)">${s.scope}</span>
        <div>
          <div class="font-mono text-[26px] font-medium mb-2.5" style="color:var(--dark)">${e(s.path)}</div>
          ${s.pros?`<div class="flex flex-wrap gap-2.5">${s.pros.map(p=>`<span class="text-[20px] px-3 py-1 rounded" style="background:oklch(95% 0.015 155);color:var(--text)"><span style="color:var(--green);font-weight:600">✓</span> ${p}</span>`).join('')}</div>`:''}
        </div>
      </div>`;

    case 'location-group':
      return `<div class="px-7 py-[18px] bg-white rounded-xl border" style="border-color:var(--border)">
        <div class="text-[20px] font-bold mb-3.5" style="color:var(--accent)">${s.label}</div>
        <div class="flex gap-9">
          ${s.items.map(it=>`<div>
            <div class="font-mono text-[24px] font-medium mb-1" style="color:var(--dark)">${e(it.path)}</div>
            <div class="text-[19px]" style="color:var(--muted)">${e(it.scope)}</div>
          </div>`).join('')}
        </div>
      </div>`;

    case 'two-col':
      const col = (c,color) => `<div class="bg-white rounded-xl border px-8 py-7 flex flex-col gap-4" style="border-color:var(--border)">
        <div class="text-[34px] font-bold" style="color:var(${color})">${c.label}</div>
        ${c.tagline?`<div class="text-[24px] -mt-2" style="color:var(--muted)">${c.tagline}</div>`:''}
        <ul class="flex flex-col gap-3.5 list-none">${c.items.map(i=>`<li class="text-[26px] leading-[1.4] flex gap-2" style="color:var(--text)"><span style="color:var(--muted)">→</span><span>${i}</span></li>`).join('')}</ul>
      </div>`;
      return `<div class="grid grid-cols-2 gap-7">${col(s.left,'--blue')}${col(s.right,'--accent')}</div>`;

    case 'comparison-col':
      return `<div class="h-full bg-white rounded-xl border px-10 py-8 flex flex-col gap-4" style="border-color:var(--border)">
        <div class="text-[34px] font-bold" style="color:var(${s.label==='Skill'?'--blue':'--accent'})">${s.label}</div>
        <div class="text-[24px] -mt-2" style="color:var(--muted)">${s.tagline}</div>
        <ul class="flex flex-col gap-3.5 list-none">${s.items.map(i=>`<li class="text-[26px] leading-[1.4] flex gap-2" style="color:var(--text)"><span style="color:var(--muted)">→</span><span>${i}</span></li>`).join('')}</ul>
      </div>`;

    case 'token-row':
      return `<div class="grid border-t" style="grid-template-columns:220px 300px 1fr 160px;border-color:var(--border);background:white">
        <div class="px-[22px] py-[18px] text-[25px] font-bold leading-[1.35] border-r" style="color:var(--text);border-color:var(--border)">${s.label}</div>
        <div class="px-[22px] py-[18px] text-[19px] font-mono leading-[1.35] border-r" style="color:var(--muted);border-color:var(--border)">${s.context}</div>
        <div class="px-[22px] py-[18px] text-[24px] leading-[1.35] border-r" style="color:var(--text);border-color:var(--border)">${s.behavior}</div>
        <div class="px-[22px] py-[18px] text-[22px] font-bold flex items-center justify-center text-center ${impactCls(s.impactLevel)}">${s.impact}</div>
      </div>`;

    case 'best-practice':
      return `<div class="flex items-start gap-[18px] py-2">
        <span class="text-[22px] min-w-[30px] text-center mt-1" style="color:var(--accent)">${s.icon}</span>
        <div class="text-[29px] leading-[1.45]" style="color:var(--text)">${s.text}</div>
      </div>`;

    case 'strategy':
      return `<div class="bg-white rounded-xl border px-7 py-6" style="border-color:var(--border)">
        <div class="text-[16px] font-bold tracking-[0.1em] uppercase mb-2" style="color:var(--accent)">${s.rank}</div>
        <div class="text-[30px] font-bold mb-2" style="color:var(--text)">${s.title}</div>
        <div class="text-[24px] leading-[1.4] mb-3" style="color:var(--muted)">${s.desc}</div>
        <div class="flex flex-wrap gap-2">
          ${(s.pros||[]).map(p=>`<span class="text-[18px] px-2.5 py-1 rounded" style="background:oklch(95% 0.015 155);color:var(--text)"><span style="color:var(--green);font-weight:600">✓</span> ${p}</span>`).join('')}
          ${(s.cons||[]).map(c=>`<span class="text-[18px] px-2.5 py-1 rounded" style="background:oklch(95% 0.01 80);color:var(--muted)"><span style="color:var(--amber)">⚠</span> ${c}</span>`).join('')}
        </div>
      </div>`;

    case 'distribution':
      return `<div class="bg-white rounded-xl border px-9 py-8" style="border-color:var(--border)">
        <div class="text-[16px] font-bold tracking-[0.1em] uppercase mb-2.5" style="color:var(--accent)">${s.rank}</div>
        <div class="text-[34px] font-bold mb-3" style="color:var(--text)">${s.title}</div>
        <div class="text-[27px] leading-[1.45]" style="color:var(--muted)">${s.desc}</div>
      </div>`;

    case 'code':
      return `<div class="rounded-xl overflow-hidden" style="background:var(--code-bg)">
        ${s.label?`<div class="px-5 py-2.5 text-[18px] font-mono text-white/45 tracking-[0.05em]" style="background:oklch(22% 0.05 240);border-bottom:1px solid rgba(255,255,255,.06)">${s.label}</div>`:''}
        <pre class="px-7 py-[22px] text-[23px] font-mono leading-[1.65] whitespace-pre overflow-auto max-h-[460px]" style="color:var(--code-fg)">${highlight(s.content)}</pre>
      </div>`;

    case 'bullet':
      return `<div class="flex items-start gap-4 text-[28px] leading-[1.4]" style="color:var(--text)">
        <span class="shrink-0 mt-0.5 font-semibold" style="color:var(--accent)">→</span>${s.text}</div>`;

    default:
      return `<div class="text-red-500 text-[20px]">Step inconnu : ${s.type}</div>`;
  }
}

/* ── Slide builders ───────────────────────────────────── */
function buildSlide(data, idx) {
  const el = document.createElement('div');
  el.className = `slide slide-${data.type}-type absolute inset-0 w-[1920px] h-[1080px] flex flex-col opacity-0 pointer-events-none`;
  el.id = data.id;
  el.dataset.index = idx;

  const steps = (cls='') => data.steps.map((s,i) =>
    `${wrap(i+1,cls)}${step(s)}</div>`).join('');

  switch(data.type) {

    case 'title':
      el.style.background = 'var(--dark)';
      el.innerHTML = `
        <div class="absolute right-0 top-0 bottom-0 w-[420px] opacity-40"
             style="background:linear-gradient(135deg,transparent,var(--dark-mid))"></div>
        <div class="absolute right-[100px] top-1/2 -translate-y-1/2 w-0.5 h-[320px]"
             style="background:linear-gradient(to bottom,transparent,var(--accent),transparent)"></div>
        <span class="absolute top-[56px] left-[100px] text-[20px] font-semibold tracking-[0.18em] uppercase"
              style="color:var(--accent)">${data.meta}</span>
        <div class="absolute top-1/2 left-[100px] right-[140px] -translate-y-[52%]">
          <h1 class="text-[96px] font-bold tracking-tight leading-none text-white mb-2">${data.title}</h1>
          <h2 class="text-[82px] font-semibold leading-none mb-9" style="color:var(--accent)">${data.accent}</h2>
          <p class="text-[34px] font-light text-white/60 leading-relaxed max-w-[900px]">${data.tagline}</p>
        </div>
        <div class="absolute bottom-[72px] left-[100px] text-[22px] text-white/25">${data.meta}</div>`;
      break;

    case 'section':
      el.style.background = 'var(--dark)';
      el.innerHTML = `
        <div class="absolute left-0 top-0 bottom-0 w-1.5" style="background:var(--accent)"></div>
        <div class="absolute right-[-30px] top-1/2 -translate-y-1/2 text-[380px] font-bold leading-none
                    text-white/[0.03] select-none pointer-events-none">${data.num}</div>
        <div class="absolute top-1/2 left-[100px] -translate-y-[52%] max-w-[960px]">
          <span class="inline-block text-[16px] font-bold tracking-[0.14em] uppercase px-4 py-1.5 border rounded mb-7"
                style="color:var(--accent);border-color:var(--accent)">Section ${data.num}</span>
          <h2 class="text-[78px] font-bold text-white tracking-tight leading-[1.1] mb-11">${data.title}</h2>
          <ul class="list-none flex flex-col gap-3.5">
            ${data.items.map(it=>`<li class="text-[30px] text-white/50 flex gap-3">
              <span style="color:var(--accent-dim)">—</span><span>${it}</span></li>`).join('')}
          </ul>
        </div>`;
      break;

    case 'agenda':
      el.style.background = 'var(--bg)';
      el.innerHTML = `${eyebrow(data,idx)}${hdr(data)}
        ${body('flex flex-col gap-4',
          data.steps.map((s,i)=>`
            <div class="step-item opacity-0 translate-y-3 pointer-events-none flex items-center gap-7 px-7 py-[18px] bg-white rounded-xl border" style="border-color:var(--border)" data-step="${i+1}">
              <span class="font-mono text-[20px] font-bold min-w-[56px] text-center px-3.5 py-1.5 rounded-lg" style="color:var(--accent);background:var(--accent-bg)">${s.num}</span>
              <span class="text-[34px] font-medium" style="color:var(--text)">${s.text}</span>
            </div>`).join('')
        )}`;
      break;

    case 'content':
      el.style.background = 'var(--bg)';
      el.innerHTML = `${eyebrow(data,idx)}${hdr(data)}${body('flex flex-col gap-3.5', steps())}`;
      break;

    case 'twocol':
      el.style.background = 'var(--bg)';
      el.innerHTML = `${eyebrow(data,idx)}${hdr(data)}${body('grid grid-cols-2 gap-9 items-start content-start', steps())}`;
      break;

    case 'grid': {
      const cols = data.steps.length>=3 ? 'grid-cols-3' : 'grid-cols-2';
      el.style.background = 'var(--bg)';
      el.innerHTML = `${eyebrow(data,idx)}${hdr(data)}${body(`grid ${cols} gap-6 content-start`, steps())}`;
      break;
    }

    case 'token':
      el.style.background = 'var(--bg)';
      el.innerHTML = `${eyebrow(data,idx)}${hdr(data)}
        <div class="flex-1 overflow-hidden px-[80px] pt-5 pb-[60px]" style="background:var(--bg)">
          <div class="rounded-xl overflow-hidden border" style="border-color:var(--border)">
            <div class="grid text-[16px] font-semibold tracking-[0.07em] uppercase text-white/55"
                 style="grid-template-columns:220px 300px 1fr 160px;background:var(--dark)">
              <div class="px-[22px] py-3 border-r border-white/10">Source</div>
              <div class="px-[22px] py-3 border-r border-white/10">Fichier / Mécanisme</div>
              <div class="px-[22px] py-3 border-r border-white/10">Comportement</div>
              <div class="px-[22px] py-3">Impact tokens</div>
            </div>
            ${steps()}
          </div>
        </div>`;
      break;

    case 'table':
      el.style.background = 'var(--bg)';
      el.innerHTML = `${eyebrow(data,idx)}${hdr(data)}
        <div class="flex-1 overflow-hidden px-[80px] pt-5 pb-[60px]" style="background:var(--bg)">
          <table class="w-full border-collapse text-[27px]">
            <thead><tr>
              <th class="px-[22px] py-3.5 text-left text-[22px] font-bold text-white/85 w-[260px]" style="background:var(--dark)">${data.columns[0]}</th>
              <th class="px-[22px] py-3.5 text-left text-[22px] font-bold text-white" style="background:var(--blue)">${data.columns[1]}</th>
              <th class="px-[22px] py-3.5 text-left text-[22px] font-bold text-white" style="background:var(--accent)">${data.columns[2]}</th>
            </tr></thead>
            <tbody>
              ${data.steps.map((s,i)=>`
                <tr class="step-item opacity-0 pointer-events-none" data-step="${i+1}">
                  <td class="px-[22px] py-[13px] border-b font-semibold" style="color:var(--dark);border-color:var(--border)">${s.cells[0]}</td>
                  <td class="px-[22px] py-[13px] border-b" style="color:var(--blue);border-color:var(--border)">${s.cells[1]}</td>
                  <td class="px-[22px] py-[13px] border-b" style="color:var(--accent);border-color:var(--border)">${s.cells[2]}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      break;

    case 'discussion':
      el.style.background = 'var(--dark)';
      el.innerHTML = `
        <div class="absolute left-0 top-0 bottom-0 w-1.5" style="background:var(--accent)"></div>
        <div class="absolute top-1/2 left-[100px] right-[120px] -translate-y-[52%]">
          <h2 class="text-[80px] font-bold text-white tracking-tight mb-5">${data.title}</h2>
          <p class="text-[38px] mb-[52px]" style="color:var(--accent)">${data.prompt}</p>
          <div class="flex flex-col gap-[18px]">
            ${data.hints.map(h=>`<div class="text-[27px] text-white/48 leading-[1.35]">💡&nbsp; ${h}</div>`).join('')}
          </div>
        </div>`;
      break;
  }
  return el;
}

/* ── Progress bar ─────────────────────────────────────── */
function buildProgress() {
  const nav = document.getElementById('progress');
  nav.innerHTML = PRESENTATION_DATA.sections.map(sec =>
    `<div class="prog-sec flex flex-col justify-center gap-1 px-[18px] border-r cursor-pointer
                 transition-colors hover:bg-[var(--dark-mid)] select-none"
          style="flex:${sec.slides.length};border-color:var(--dark-mid)"
          data-sec="${sec.id}">
      <div class="flex gap-1.5 items-center">
        ${sec.slides.map(si=>`<div class="prog-dot w-1.5 h-1.5 rounded-full transition-all bg-white/20" data-slide="${si}"></div>`).join('')}
      </div>
      <div class="prog-lbl text-[13px] font-medium tracking-[0.05em] uppercase whitespace-nowrap text-white/35">${sec.label}</div>
    </div>`
  ).join('');

  nav.querySelectorAll('.prog-sec').forEach(el => {
    el.addEventListener('click', () => {
      const sec = PRESENTATION_DATA.sections.find(s => s.id === el.dataset.sec);
      if (!sec) return;
      currentSlide = sec.slides[0];
      currentStep  = 0;
      activateSlide(currentSlide);
      applySteps();
      updateProgress();
      save();
    });
  });
}

function updateProgress() {
  const secId = PRESENTATION_DATA.slides[currentSlide]?.sectionId;
  document.querySelectorAll('.prog-dot').forEach(d => {
    const si = +d.dataset.slide;
    d.className = `prog-dot w-1.5 h-1.5 rounded-full transition-all ${
      si  < currentSlide ? 'bg-[var(--accent-dim)]'
      : si === currentSlide ? 'bg-[var(--accent-hi)] scale-[1.6]'
      : 'bg-white/20'
    }`;
  });
  document.querySelectorAll('.prog-sec').forEach(s => {
    const active = s.dataset.sec === secId;
    s.style.background = active ? 'var(--dark-mid)' : '';
    s.querySelector('.prog-lbl').style.color = active ? 'rgba(255,255,255,.88)' : '';
  });
}

/* ── Steps reveal ─────────────────────────────────────── */
function applySteps() {
  const active = document.querySelector('.slide.active');
  if (!active) return;
  active.querySelectorAll('.step-item').forEach(el => {
    const rev = +el.dataset.step <= currentStep;
    el.classList.toggle('opacity-0',    !rev);
    el.classList.toggle('translate-y-3',!rev && !el.closest('.slide-table-type') && !el.closest('.slide-token-type'));
    el.classList.toggle('pointer-events-none', !rev);
    el.classList.toggle('opacity-100',   rev);
    el.classList.toggle('translate-y-0', rev);
    el.classList.toggle('pointer-events-auto', rev);
  });
}

function activateSlide(idx) {
  document.querySelectorAll('.slide').forEach((s,i) => {
    const on = i === idx;
    s.classList.toggle('opacity-0',           !on);
    s.classList.toggle('opacity-100',          on);
    s.classList.toggle('pointer-events-none', !on);
    s.classList.toggle('pointer-events-auto',  on);
    s.classList.toggle('active',               on);
  });
}

/* ── Navigation ───────────────────────────────────────── */
function forward() {
  const max = PRESENTATION_DATA.slides[currentSlide].steps.length;
  if (currentStep < max) { currentStep++; }
  else if (currentSlide < PRESENTATION_DATA.slides.length - 1) {
    currentSlide++; currentStep = 0; activateSlide(currentSlide);
  }
  applySteps(); updateProgress(); save();
}

function backward() {
  if (currentStep > 0) { currentStep--; }
  else if (currentSlide > 0) {
    currentSlide--;
    currentStep = PRESENTATION_DATA.slides[currentSlide].steps.length;
    activateSlide(currentSlide);
  }
  applySteps(); updateProgress(); save();
}

function save() { localStorage.setItem(SK, JSON.stringify({slide:currentSlide, step:currentStep})); }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SK)||'{}');
    currentSlide = Math.min(d.slide||0, PRESENTATION_DATA.slides.length-1);
    currentStep  = d.step||0;
  } catch(x) {}
}

document.addEventListener('keydown', ev => {
  switch(ev.key) {
    case 'ArrowRight': case 'ArrowDown': case ' ': case 'Enter':
      ev.preventDefault(); forward(); break;
    case 'ArrowLeft': case 'ArrowUp': case 'Backspace':
      ev.preventDefault(); backward(); break;
    case 'Home':
      currentSlide=0; currentStep=0; activateSlide(0); applySteps(); updateProgress(); save(); break;
    case 'End':
      currentSlide=PRESENTATION_DATA.slides.length-1;
      currentStep=PRESENTATION_DATA.slides[currentSlide].steps.length;
      activateSlide(currentSlide); applySteps(); updateProgress(); save(); break;
  }
});

/* ── Scale + Init ─────────────────────────────────────── */
function scale() {
  const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  document.getElementById('canvas').style.transform = `scale(${s})`;
}
window.addEventListener('resize', scale);

function init() {
  const c = document.getElementById('slides-container');
  PRESENTATION_DATA.slides.forEach((d,i) => c.appendChild(buildSlide(d,i)));
  buildProgress();
  load();
  activateSlide(currentSlide);
  applySteps();
  updateProgress();
  scale();
}
init();
</script>
</body>
</html>
