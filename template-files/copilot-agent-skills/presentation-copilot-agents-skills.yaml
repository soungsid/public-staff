# Source de contenu de la présentation « GitHub Copilot — Personnaliser son assistant ».
# Ce fichier est la trace rédactionnelle : contenu affiché + ce qui se dit à l'oral + sources.
# Le rendu, lui, est piloté par copilot-data.js — les deux doivent rester synchronisés.

presentation:
  titre: "GitHub Copilot — Personnaliser son assistant"
  sous_titre: "Skills, agents, hooks et plugins"
  audience: "Équipe de développeurs — première approche du sujet"
  date: "2026-09-11"
  objectif: >
    Introduire un public qui ne connaît ni les agents, ni les skills, ni les hooks,
    ni les plugins ou le marketplace. On vise la compréhension du vocabulaire et
    la capacité à choisir la bonne brique, pas l'exhaustivité de la documentation.
  duree_estimee: "30 à 40 minutes, discussion finale comprise"

  fichiers:
    moteur: "Copilot Agents & Skills.html — moteur de rendu, à ne pas modifier pour du contenu"
    contenu: "copilot-data.js — les slides ; c'est ce fichier qu'on édite pour changer un texte"
    source: "presentation-copilot-agents-skills.yaml — ce fichier"

  principes_de_conception:
    - "Une idée par slide, révélée pas à pas au clic pour éviter le mur de texte."
    - >
      Les skills avant les agents : on part du concept le plus simple et le plus
      immédiatement utile, on introduit l'autonomie ensuite.
    - >
      La comparaison skill / agent n'est faite qu'UNE fois, à la fin de la section
      agents, quand les deux notions sont connues. Elle était auparavant répétée
      trois fois — c'est la redondance principale qui a été supprimée.
    - >
      Les emplacements de fichiers sont traités une seule fois, pour les agents et
      les skills ensemble : ce sont les mêmes portées.

sections:
  - id: intro
    label: "Intro"
    slides: [s00, s01, s02]
  - id: skills
    label: "01 · Skills"
    slides: [s03, s04, s05]
  - id: agents
    label: "02 · Agents"
    slides: [s06, s07, s08, s09]
  - id: sharing
    label: "03 · Partage"
    slides: [s10, s11, s12]
  - id: extend
    label: "04 · Aller + loin"
    slides: [s13, s14, s15, s16]
  - id: discussion
    label: "Discussion"
    slides: [s17]

slides:

  # ── INTRO ────────────────────────────────────────────────────────────────

  - id: s00
    type: titre
    titre: "GitHub Copilot — Le personnaliser"
    accroche: "Skills, agents, hooks et plugins — comment lui apprendre notre façon de travailler"

  - id: s01
    type: agenda
    titre: "Au programme"
    points:
      - "01 — Les skills : apprendre une tâche à Copilot"
      - "02 — Les agents : lui déléguer un rôle"
      - "03 — Partager tout ça avec l'équipe"
      - "04 — Aller plus loin : hooks, plugins, marketplace"

  - id: s02
    type: tableau
    titre: "Le vocabulaire, en une slide"
    sous_titre: "Quatre façons de donner du contexte à Copilot — plus une pour les empaqueter"
    intention: >
      Poser tout le vocabulaire d'emblée. L'audience ne connaît aucun de ces termes ;
      cette slide sert de carte de référence à laquelle on renvoie ensuite. La colonne
      « coût en tokens » remplace l'ancienne slide dédiée à l'économie de tokens.
    colonnes: ["Brique", "Où ça vit", "À quoi ça sert", "Coût en tokens"]
    lignes:
      - brique: "Instructions"
        emplacement: "copilot-instructions.md"
        role: "Le contexte permanent du projet : stack, conventions, règles. Injecté à CHAQUE message."
        cout: "Élevé"
      - brique: "Skill"
        emplacement: ".github/skills/<nom>/"
        role: "Le mode d'emploi d'UNE tâche précise et répétable. Chargé seulement quand il sert."
        cout: "Faible"
      - brique: "Agent"
        emplacement: ".github/agents/*.agent.md"
        role: "Un rôle délégué : Copilot raisonne, choisit ses outils et enchaîne les actions."
        cout: "Moyen"
      - brique: "Hook"
        emplacement: ".github/hooks/*.json"
        role: "Du code déclenché automatiquement à un moment clé. Ne passe pas par le modèle."
        cout: "Zéro"
      - brique: "Plugin"
        emplacement: "plugin.json"
        role: "Le paquet qui regroupe skills, agents et hooks pour les installer d'un coup."
        cout: "Conteneur — ne coûte rien par lui-même"

  # ── 01 · SKILLS ──────────────────────────────────────────────────────────

  - id: s03
    type: section
    numero: "01"
    titre: "Les skills"
    annonces:
      - "Apprendre une tâche à Copilot"
      - "Anatomie d'un skill"
      - "Le chargement à la demande"

  - id: s04
    type: contenu
    titre: "Qu'est-ce qu'un skill ?"
    definition: >
      Un skill est un mode d'emploi écrit une fois pour toutes. Il décrit UNE tâche
      précise et répétable — telle que notre équipe la fait. Copilot l'applique
      ensuite à l'identique, sans qu'on ait à réexpliquer.
    exemples:
      - "Générer un ADR"
      - "Rédiger un changelog"
      - "Écrire un test selon nos conventions"
      - "Ouvrir une PR au bon format"
    regle_chargement_progressif: >
      Copilot ne lit d'abord que le name et la description. Le reste n'est chargé que
      si le skill est pertinent — d'où un catalogue de cinquante skills qui ne coûte
      presque rien.
    declenchement: >
      Automatique quand la description correspond à la demande, ou en nommant le skill
      explicitement.
    a_dire_a_l_oral: >
      C'est le point à faire passer en priorité : écrire un skill n'alourdit pas les
      conversations où il ne sert pas. C'est ce qui rend l'investissement sans risque.

  - id: s05
    type: contenu
    titre: "Anatomie d'un skill"
    sous_titre: "Un dossier, un seul fichier obligatoire : les métadonnées en tête, les instructions en dessous"
    fichier_requis:
      nom: "SKILL.md"
      frontmatter:
        - champ: "name"
          statut: "requis"
          description: "Identifiant en minuscules, tirets à la place des espaces"
        - champ: "description"
          statut: "requis"
          description: "But du skill et quand l'utiliser — c'est ce qui décide du déclenchement"
        - champ: "license"
          statut: "optionnel"
          description: "Licence du skill"
        - champ: "allowed-tools"
          statut: "optionnel"
          description: "Pré-autorise certains outils (shell, bash…)"
      note_version: >
        Pas de champ `version` dans un SKILL.md : il n'est pas documenté côté GitHub.
        Le versionnement se fait au niveau du plugin.json ou du marketplace.json.
        (L'ancienne version de cette présentation l'affichait à tort.)
    exemple: |
      ---
      name: generate-adr
      description: Génère un Architecture Decision Record à partir d'une décision technique
      ---

      ## Instructions

      Quand l'utilisateur décrit une décision d'architecture, produis un ADR suivant
      le modèle de templates/adr-template.md — sections Contexte, Décision, Conséquences.
      Nomme le fichier docs/adr/AAAA-MM-JJ-<sujet-en-kebab-case>.md
    sous_dossiers_optionnels:
      - dossier: "templates/"
        description: "Modèles de fichiers que Copilot remplit (template d'ADR, de test…)"
      - dossier: "references/"
        description: "Documentation à consulter : conventions, glossaire métier, specs"
      - dossier: "scripts/"
        description: "Scripts exécutables quand la tâche demande de l'automatisation réelle"
    note: "Ces sous-dossiers ne sont lus que si la tâche l'exige — c'est le même principe de chargement à la demande."

  # ── 02 · AGENTS ──────────────────────────────────────────────────────────

  - id: s06
    type: section
    numero: "02"
    titre: "Les agents"
    annonces:
      - "Déléguer un rôle, pas une tâche"
      - "Anatomie d'un agent"
      - "Skill ou agent : comment choisir"

  - id: s07
    type: contenu
    titre: "Qu'est-ce qu'un agent ?"
    definition: >
      Un agent est un collègue virtuel spécialisé. On lui confie un rôle et on limite
      les outils auxquels il a droit — puis il raisonne, décide et enchaîne les actions
      jusqu'à l'objectif.
    exemples_de_roles:
      - "Relecteur sécurité"
      - "Planificateur"
      - "Rédacteur de documentation"
      - "Assistant de migration"
    invocation: >
      /agent dans le CLI, `copilot --agent <nom>` en ligne de commande — ou
      automatiquement, quand Copilot juge sa description pertinente.
    formule_a_retenir: "Un skill sait COMMENT faire ; un agent cherche QUOI faire."

  - id: s08
    type: contenu
    titre: "Anatomie d'un agent"
    sous_titre: "Un seul fichier : <nom>.agent.md"
    frontmatter:
      - champ: "description"
        statut: "REQUIS"
        description: "Ce qu'il fait : c'est ce qui décide si Copilot l'invoque seul"
      - champ: "name"
        statut: "optionnel"
        description: "Nom affiché ; à défaut, c'est le nom du fichier qui sert d'identifiant"
      - champ: "tools"
        statut: "optionnel"
        description: "Les outils auxquels il a droit — non renseigné, il les a tous"
      - champ: "model"
        statut: "optionnel"
        description: "Le modèle à utiliser ; sinon celui de la session (non affiché sur la slide, faute de place)"
      - champ: "target"
        statut: "optionnel"
        description: "vscode ou github-copilot ; non défini = les deux"
      - champ: "disable-model-invocation / user-invocable"
        statut: "optionnel"
        description: "Contrôlent respectivement la sélection automatique et la sélection manuelle"
    exemple: |
      ---
      name: security-reviewer
      description: Analyse le code pour détecter les vulnérabilités. Ne modifie jamais de fichier.
      tools: view, grep, glob
      ---

      Tu es un expert en sécurité applicative : OWASP Top 10, injections, secrets exposés.
      Tu produis un rapport — sévérité, localisation, recommandation — sans jamais corriger toi-même.
    point_cle: >
      Aucun outil d'écriture n'est listé : l'agent est structurellement incapable de
      modifier un fichier. C'est la bonne façon de garantir un périmètre — une consigne
      en langage naturel, le modèle peut s'en écarter.
    limite_technique: "Le corps markdown est plafonné à 30 000 caractères."

  - id: s09
    type: tableau
    titre: "Skill ou agent ?"
    sous_titre: "La dernière ligne suffit à trancher dans 90 % des cas"
    intention: >
      Slide unique de comparaison. Elle remplace les trois passages redondants de la
      version précédente (encart dans « Qu'est-ce qu'un skill », slide « Raison d'être »,
      tableau comparatif de huit lignes).
    colonnes: ["", "Skill", "Agent"]
    lignes:
      - ["Ce que c'est", "Le mode d'emploi d'une tâche", "Un rôle avec un objectif"]
      - ["Autonomie", "Aucune — il applique", "Forte — il décide et enchaîne"]
      - ["Résultat", "Reproductible à l'identique", "Variable selon le raisonnement"]
      - ["Format", "Un dossier + SKILL.md", "Un fichier .agent.md"]
      - ["Coût", "Faible — chargé à la demande", "Moyen — rôle chargé en entier"]
      - ["À choisir si…", "La façon de faire est connue et fixe", "Le chemin est à trouver au cas par cas"]

  # ── 03 · PARTAGE ─────────────────────────────────────────────────────────

  - id: s10
    type: section
    numero: "03"
    titre: "Partager avec l'équipe"
    annonces:
      - "Où ranger ses skills et agents"
      - "Qui y a accès"
      - "Bonnes pratiques"

  - id: s11
    type: contenu
    titre: "Où ça vit — et donc qui y a accès"
    intention: >
      L'emplacement EST la stratégie de partage : inutile de traiter les deux
      séparément comme le faisait la version précédente.
    portees:
      - portee: "Dans le projet"
        chemins: [".github/agents/", ".github/skills/"]
        avantages:
          - "Versionné avec le code"
          - "Disponible dès le clone du repo"
          - "Évolue en pull request, donc relu"
      - portee: "Sur ma machine"
        chemins: ["~/.copilot/agents/", "~/.copilot/skills/"]
        avantages:
          - "Présent dans tous mes projets"
          - "Aucune configuration par repo"
          - "Idéal pour mes outils perso"
      - portee: "Repo d'équipe"
        chemins: ["mon-org/copilot-toolbox"]
        avantages:
          - "Un seul endroit pour toute l'équipe"
          - "Pas de duplication entre projets"
          - "Versionnable par releases"
    emplacements_egalement_reconnus:
      - chemin: ".claude/skills/<nom>/"
        scope: "Projet · lu par Claude Code ET Copilot"
      - chemin: ".agents/skills/<nom>/"
        scope: "Projet · format neutre"
      - chemin: "~/.agents/skills/<nom>/"
        scope: "Personnel · format neutre (non affiché sur la slide)"
    priorite: >
      En cas de doublon, la version personnelle prend le dessus sur celle du projet —
      on peut donc surcharger un outil d'équipe sans toucher au repo.
      Ordre complet côté agents : utilisateur > dépôt > organisation > entreprise.
    note_vscode: >
      VS Code reconnaît par défaut .github/skills/, .claude/skills/, .agents/skills/
      et ~/.copilot/skills/. Le réglage chat.agentSkillsLocations permet d'en ajouter
      (utile en monorepo).

  - id: s12
    type: contenu
    titre: "Bonnes pratiques"
    pratiques:
      - "Soigner la description avant tout le reste — c'est elle qui décide du déclenchement automatique."
      - "Nommer en verbe-objet, en kebab-case : generate-adr, review-security."
      - "Restreindre les outils au strict nécessaire — un agent sans outil d'écriture ne peut rien casser."
      - "Mettre des exemples concrets dans le fichier : c'est ce qui guide le mieux le comportement."
      - "Tester chez soi, puis promouvoir dans le repo d'équipe une fois le comportement stable."
      - "Commencer petit : un skill utile cette semaine vaut mieux qu'un agent parfait un jour."

  # ── 04 · ALLER PLUS LOIN ─────────────────────────────────────────────────

  - id: s13
    type: section
    numero: "04"
    titre: "Aller plus loin"
    annonces:
      - "Les hooks — automatiser sans le modèle"
      - "Les plugins — tout empaqueter"
      - "Distribution et marketplace"

  - id: s14
    type: contenu
    titre: "Les hooks"
    sous_titre: "Quand la règle doit s'appliquer à coup sûr, on ne la demande pas — on la branche"
    definition: >
      Un hook est un script déclenché automatiquement à un moment clé de la session.
      Il ne passe pas par le modèle : c'est du code, donc déterministe, immédiat et
      gratuit en tokens.
    cycle_de_vie_affiche:
      - { moment: "Début de session", evenement: "sessionStart" }
      - { moment: "Prompt envoyé", evenement: "userPromptSubmitted" }
      - { moment: "Avant un outil", evenement: "preToolUse" }
      - { moment: "Après un outil", evenement: "postToolUse" }
      - { moment: "Fin de session", evenement: "sessionEnd" }
    autres_evenements_non_affiches:
      - "userPromptTransformed, postToolUseFailure, agentStop, errorOccurred"
      - "subagentStart, subagentStop, preCompact, permissionRequest, notification"
    usages_montres:
      - "preToolUse peut répondre allow, ask ou deny — de quoi bloquer une commande destructrice AVANT qu'elle s'exécute."
      - "postToolUse pour lancer le formateur et le linter après chaque fichier modifié."
    emplacements:
      equipe: ".github/hooks/*.json"
      personnel: "~/.copilot/hooks/"
      autres: "politique machine, .github/copilot/settings.json, ~/.copilot/settings.json, hooks/hooks.json d'un plugin installé"
    regle_de_tri: >
      Si la consigne est toujours vraie et vérifiable par du code, c'est un hook —
      pas une instruction que le modèle pourrait oublier.
    pieges_a_connaitre:
      - "Le nom est userPromptSubmitted (avec -ed) côté Copilot, pas userPromptSubmit comme chez Claude Code."
      - "Les alias PascalCase compatibles VS Code / Claude (PreToolUse, Stop…) sont acceptés."
      - "preToolUse est fail-closed : une erreur du script bloque l'appel. Les autres événements sont fail-open."

  - id: s15
    type: contenu
    titre: "Les plugins"
    sous_titre: "Le format officiel pour distribuer tout ce qu'on vient de voir"
    definition: >
      Un plugin est un paquet installable. Il regroupe skills, agents, hooks et
      connexions à des outils externes en une seule unité — on l'installe d'une
      commande, on le met à jour comme une dépendance.
    contenu_du_paquet:
      - fichier: "plugin.json"
        statut: "REQUIS"
        description: "Le manifeste : nom, version, description et composants inclus"
      - fichier: "skills/"
        statut: "optionnel"
        description: "Les dossiers de skills, avec leur SKILL.md"
      - fichier: "agents/"
        statut: "optionnel"
        description: "Les fichiers .agent.md — les rôles personnalisés"
      - fichier: "hooks/"
        statut: "optionnel"
        description: "Les scripts branchés sur les événements de session (hooks/hooks.json)"
      - fichier: "mcp.json"
        statut: "optionnel"
        description: "Connexions à des serveurs externes (MCP) — non détaillé dans cette présentation"
    precision_importante: >
      Le manifeste est plugin.json À LA RACINE du plugin, pas .github/plugin.json.
      (.github/plugin/marketplace.json, lui, concerne le marketplace.)
      Emplacements alternatifs reconnus : .claude-plugin/ ou .plugin/ — un plugin
      Claude bien structuré est donc largement réutilisable côté Copilot.

  - id: s16
    type: grille
    titre: "Distribution & marketplace"
    modes:
      - rang: "Le plus simple"
        titre: "Dépôt Git ou dossier local"
        description: "On installe depuis un dépôt GitHub, public ou privé — ou depuis un simple chemin local."
        commande: "copilot plugin install org/toolbox"
      - rang: "À l'échelle de l'équipe"
        titre: "Marketplace"
        description: >
          Un catalogue déclaré une fois, que chacun parcourt et installe à la demande.
          Deux sont fournis d'office : copilot-plugins et awesome-copilot.
        commande: "copilot plugin marketplace add org/repo"
      - rang: "Gouvernance"
        titre: "Déploiement centralisé"
        description: >
          Les administrateurs peuvent imposer un jeu de plugins à toute l'organisation —
          tout le monde travaille alors avec les mêmes règles, sans rien installer.
    autres_commandes_utiles:
      - "copilot plugin list | update NAME | enable NAME | disable NAME | uninstall NAME"
      - "copilot plugin marketplace list | browse NAME | update | remove NAME"
      - "Formes d'installation : plugin@marketplace, OWNER/REPO, OWNER/REPO:CHEMIN, URL git, chemin local"

  # ── DISCUSSION ───────────────────────────────────────────────────────────

  - id: s17
    type: discussion
    titre: "À nous de jouer"
    question: "Quelle tâche répétitive aimeriez-vous ne plus jamais réexpliquer ?"
    amorces:
      - "Un skill qui génère nos ADR au bon format"
      - "Un skill qui écrit les tests selon nos conventions"
      - "Un agent qui relit la sécurité de nos PR"
      - "Un hook qui lance le linter après chaque modification"
    objectif: "Sortir de la séance avec un premier skill identifié, pas avec une liste d'intentions."

# ── Corrections apportées à la version précédente ──────────────────────────

corrections_factuelles:
  - sujet: "Frontmatter des custom agents"
    ancien: "permissions, safe-outputs et on présentés comme des champs d'un .agent.md"
    correct: >
      Ces trois champs n'existent pas pour les custom agents : ils appartiennent à
      GitHub Agentic Workflows, un produit distinct dont les fichiers vivent dans
      .github/workflows/. Le périmètre d'un agent se restreint via `tools`.
  - sujet: "Champ version d'un skill"
    ancien: "version: 1.0.0 dans le frontmatter du SKILL.md"
    correct: "Non documenté côté GitHub — retiré de l'exemple."
  - sujet: "Manifeste de plugin"
    ancien: ".github/plugin.json"
    correct: "plugin.json à la racine du plugin."
  - sujet: "Invocation d'un agent"
    ancien: "@nom-agent"
    correct: "/agent en interactif, ou `copilot --agent <nom>` en ligne de commande."
  - sujet: "Marketplace"
    ancien: "Présenté comme une perspective (« bientôt », « roadmap »)"
    correct: >
      Le mécanisme existe : marketplace.json, commandes copilot plugin marketplace,
      et deux marketplaces enregistrés par défaut.

sources:
  hooks:
    - "https://docs.github.com/en/copilot/reference/hooks-reference"
    - "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/use-hooks"
  agents:
    - "https://docs.github.com/en/copilot/reference/custom-agents-configuration"
    - "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/create-custom-agents-for-cli"
  skills:
    - "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-skills"
    - "https://code.visualstudio.com/docs/agent-customization/agent-skills"
  plugins:
    - "https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-cli-plugins"
    - "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-plugin-reference"
    - "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/plugins-marketplace"
  agentic_workflows:
    - "https://docs.github.com/en/copilot/concepts/agents/about-github-agentic-workflows"
  date_de_verification: "2026-09-11"
